<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="ms" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A94E33"/>
      <stop offset="1" stop-color="#D99A4E"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ms)"/>
  <!-- axes -->
  <g stroke="#FAF5EE" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="170" y1="330" x2="640" y2="330"/>
    <line x1="170" y1="330" x2="170" y2="90"/>
  </g>
  <!-- scattered data points -->
  <g fill="#FAF5EE" opacity="0.85">
    <circle cx="228" cy="292" r="9"/>
    <circle cx="286" cy="266" r="9"/>
    <circle cx="330" cy="288" r="9"/>
    <circle cx="382" cy="232" r="9"/>
    <circle cx="436" cy="212" r="9"/>
    <circle cx="486" cy="176" r="9"/>
    <circle cx="540" cy="186" r="9"/>
    <circle cx="592" cy="140" r="9"/>
  </g>
  <!-- fitted regression line -->
  <line x1="205" y1="308" x2="620" y2="140" stroke="#38312A" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <text x="400" y="404" font-family="Georgia, serif" font-size="29" fill="#FAF5EE" text-anchor="middle" opacity="0.95">Machine Learning From Scratch</text>
</svg>
