<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C25E40"/>
      <stop offset="1" stop-color="#A94E33"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#tb)"/>

  <!-- coordinating agent -->
  <circle cx="400" cy="108" r="30" fill="none" stroke="#FAF5EE" stroke-width="6" opacity="0.95"/>
  <circle cx="400" cy="108" r="11" fill="#FAF5EE"/>

  <!-- layer of worker agents -->
  <g stroke="#FAF5EE" stroke-width="5" opacity="0.75">
    <line x1="400" y1="138" x2="220" y2="206"/>
    <line x1="400" y1="138" x2="340" y2="206"/>
    <line x1="400" y1="138" x2="460" y2="206"/>
    <line x1="400" y1="138" x2="580" y2="206"/>
  </g>
  <g fill="#FAF5EE" opacity="0.92">
    <circle cx="220" cy="222" r="17"/>
    <circle cx="340" cy="222" r="17"/>
    <circle cx="460" cy="222" r="17"/>
    <circle cx="580" cy="222" r="17"/>
  </g>

  <!-- market candles beneath -->
  <g stroke="#FAF5EE" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <line x1="220" y1="300" x2="220" y2="378"/>
    <line x1="300" y1="316" x2="300" y2="366"/>
    <line x1="380" y1="292" x2="380" y2="384"/>
    <line x1="460" y1="308" x2="460" y2="358"/>
    <line x1="540" y1="286" x2="540" y2="372"/>
  </g>
  <g fill="#FAF5EE" opacity="0.92">
    <rect x="209" y="316" width="22" height="44" rx="4"/>
    <rect x="289" y="328" width="22" height="28" rx="4"/>
    <rect x="369" y="306" width="22" height="60" rx="4"/>
    <rect x="449" y="320" width="22" height="30" rx="4"/>
    <rect x="529" y="300" width="22" height="52" rx="4"/>
  </g>

  <text x="400" y="424" font-family="Georgia, serif" font-size="27" fill="#FAF5EE" text-anchor="middle" opacity="0.95">Multi-Agent Trading System</text>
</svg>
