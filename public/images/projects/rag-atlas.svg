<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="ra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A6F5C"/>
      <stop offset="1" stop-color="#C25E40"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ra)"/>

  <!-- source document splitting into chunks -->
  <rect x="90" y="150" width="86" height="112" rx="10" fill="#FAF5EE" opacity="0.9"/>
  <g fill="#C25E40" opacity="0.45">
    <rect x="104" y="168" width="58" height="8" rx="4"/>
    <rect x="104" y="184" width="44" height="8" rx="4"/>
    <rect x="104" y="200" width="54" height="8" rx="4"/>
    <rect x="104" y="216" width="40" height="8" rx="4"/>
  </g>

  <!-- fan-out into parallel architecture paths -->
  <g stroke="#FAF5EE" stroke-width="4" fill="none" opacity="0.7">
    <path d="M 176 206 C 240 206 240 108 310 108"/>
    <path d="M 176 206 C 240 206 240 174 310 174"/>
    <path d="M 176 206 C 240 206 240 240 310 240"/>
    <path d="M 176 206 C 240 206 240 308 310 308"/>
  </g>

  <!-- retrieval stages, ranked bars of differing strength -->
  <g fill="#FAF5EE" opacity="0.92">
    <rect x="310" y="94" width="120" height="28" rx="8"/>
    <rect x="310" y="160" width="150" height="28" rx="8"/>
    <rect x="310" y="226" width="96" height="28" rx="8"/>
    <rect x="310" y="294" width="132" height="28" rx="8"/>
  </g>

  <!-- converge into the graded answer -->
  <g stroke="#FAF5EE" stroke-width="4" fill="none" opacity="0.7">
    <path d="M 460 108 C 530 108 530 206 590 206"/>
    <path d="M 460 174 C 530 174 530 206 590 206"/>
    <path d="M 460 240 C 530 240 530 206 590 206"/>
    <path d="M 460 308 C 530 308 530 206 590 206"/>
  </g>
  <circle cx="614" cy="206" r="34" fill="none" stroke="#FAF5EE" stroke-width="6" opacity="0.95"/>
  <path d="M 599 206 l 11 12 l 20 -24" stroke="#FAF5EE" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="400" y="404" font-family="Georgia, serif" font-size="28" fill="#FAF5EE" text-anchor="middle" opacity="0.95">RAG Atlas — Six Architectures</text>
</svg>
